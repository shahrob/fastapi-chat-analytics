[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fastapi-chat-analytics"
version = "1.0.0"
description = "Enterprise-grade FastAPI chat analytics application with AI integration"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
seed-db           = "scripts.seed_db:seed"
create-superuser  = "scripts.create_superuser:main"

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
asyncio_mode     = "auto"
addopts          = "-v --tb=short"

# ── Ruff (linting + formatting) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy (optional static type checking) ──────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
strict                 = false
